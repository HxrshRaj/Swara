name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c-module:
    name: C11 module (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: make test CC=${{ matrix.cc }}
      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-asan CC=${{ matrix.cc }}
      - name: Tests under ThreadSanitizer
        run: make test-tsan CC=${{ matrix.cc }}
      - name: Fuzz-style random inputs under ASan and UBSan (1,000,000 inputs)
        run: make fuzz CC=${{ matrix.cc }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Line coverage of the C module (gcov)
        run: make -C engine coverage | tee coverage.txt
      - name: Fail if line coverage drops below 95%
        run: |
          python3 - <<'PY'
          import re
          txt = open("coverage.txt").read()
          pcts = [float(x) for x in re.findall(r"Lines executed:([0-9.]+)%", txt)]
          print("per-file line coverage:", pcts)
          assert pcts and min(pcts) >= 95.0, "coverage below 95%"
          PY

  libfuzzer:
    name: libFuzzer (30 s, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine fuzz-libfuzzer FUZZ_SECS=30

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck on the C11 module
        run: |
          cppcheck --enable=warning,style,performance,portability --std=c11 \
            --error-exitcode=1 --inline-suppr -Iengine/c/include \
            engine/c/src engine/c/tests

  engine:
    name: Engine build and DSP correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy
      - name: Build engine
        run: make -C engine
      - name: Generate test signals
        run: cd engine && python tools/gen_test_signal.py
      - name: Independent correctness checks (filters, delay, gate, limiter)
        run: cd engine && python tools/verify_correctness.py
      - name: Threaded pipeline under ThreadSanitizer
        run: |
          cd engine
          make engine-tsan
          ./build_tsan/swara_engine --input test_audio/music_like.wav --output /tmp/tsan_out.wav \
            --effects lowpass,delay,noisegate,limiter --threaded --buffer-size 256
      - name: Ring buffer throughput (measured, informational)
        run: |
          cd engine
          cc -std=c11 -O2 -Ic/include -pthread c/tests/bench_ring.c c/src/swara_ring.c -o build/bench_ring
          ./build/bench_ring

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm ci && npm run build
